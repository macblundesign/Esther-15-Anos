
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Convite 15 Anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
}

.container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.tela {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

#convite {
    display: none;
}

/* Proporção original do envelope: 3236 x 4425 */
.arte-envelope {
    position: relative;
    width: min(100vw, calc(100vh * 3236 / 4425));
    aspect-ratio: 3236 / 4425;
}

/* Proporção original do convite: 3236 x 5994 */
.arte-convite {
    position: relative;
    width: min(100vw, calc(100vh * 3236 / 5994));
    aspect-ratio: 3236 / 5994;
}

/* Imagens */
.arte-envelope img,
.arte-convite img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
}

/* Área clicável do lacre */
.lacre {
    position: absolute;
    width: 30%;
    aspect-ratio: 1 / 1;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10;
}

/* Áreas clicáveis do convite */
.botao {
    position: absolute;
    width: 20%;
    height: 15%;
    z-index: 10;
    cursor: pointer;
}

.localizacao {
    left: 15.46%;
    top: 80.14%;
}

.presente {
    left: 39.12%;
    top: 80.31%;
}

.rsvp {
    left: 60%;
    top: 80%;
}

/* Botão para tentar abrir no Chrome do Android */
.abrir-navegador {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 100;
    padding: 10px 14px;
    border-radius: 20px;
    background: #fff;
    color: #222;
    font: 14px Arial, sans-serif;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
</style>
</head>

<body>

<div class="container">

    <!-- ENVELOPE -->
    <div id="envelope" class="tela">
        <div class="arte-envelope">
            <img src="Envelope.png" alt="Envelope">
            <div class="lacre" onclick="abrirConvite()"></div>
        </div>
    </div>

    <!-- CONVITE -->
    <div id="convite" class="tela">
        <div class="arte-convite">

            <!-- Tentar abrir a página no Chrome do Android -->
            <a
                class="abrir-navegador"
                href="intent://macblundesign.github.io/Esther-15-Anos/#Intent;scheme=https;package=com.android.chrome;end"
                target="_blank"
                rel="noopener">
                Abrir no navegador
            </a>

            <img src="Convite.png" alt="Convite">

            <!-- LOCALIZAÇÃO -->
            <div
                class="botao localizacao"
                onclick="abrirLink('https://maps.app.goo.gl/HbZhvGYtLUhTJ5sFA')">
            </div>

            <!-- PRESENTES -->
            <div
                class="botao presente"
                onclick="abrirLink('https://drive.google.com/file/d/1ffSAqs13aapm8B6C-TKGGKoJl52UiiZz/view?usp=sharing')">
            </div>

            <!-- CONFIRMAÇÃO DE PRESENÇA -->
            <div
                class="botao rsvp"
                onclick="abrirLink('https://wa.me/+5562992041324')">
            </div>

        </div>
    </div>

</div>

<!-- MÚSICA -->
<audio id="musica" src="Musica.mp4"></audio>

<script>
function abrirConvite() {
    document.getElementById('envelope').style.display = 'none';
    document.getElementById('convite').style.display = 'flex';

    const musica = document.getElementById('musica');

    musica.play().catch(() => {});
}

function abrirLink(url) {
    window.open(url, '_blank');
}
</script>

</body>
</html>
