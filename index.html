<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Convite 15 Anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* TELA */
html, body {
  width: 100%;
  height: 100%;
  background: #000;
}

/* CONTAINER PRINCIPAL */
.container {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* IMAGENS */
.tela img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  margin: auto;
  display: block;
  object-fit: contain;
  pointer-events: none;
}


/* TELAS */
.tela {
  position: absolute;
  inset: 0;
}

#convite {
  display: none;
}

/* LACRE DO ENVELOPE */
.lacre {
  position: absolute;
  width: 30%;
  aspect-ratio: 1 / 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 10;
}

/* BOTÕES DO CONVITE */
.botao {
  position: absolute;
  width: 20%;
  height: 15%;
  z-index: 10;
  cursor: pointer;
  
}


/* POSIÇÕES BASEADAS NA ARTE ORIGINAL (3236x5994) */
.localizacao {
  left: 15.46%;
  top: 80.14%;
 
}

.presente {
  left: 39.12%;
  top: 80.31%;

}

.rsvp {
  left: 60%;
  top: 80%;
 
}
</style>
</head>

<body>

<div class="container">

  <!-- ENVELOPE -->
  <div id="envelope" class="tela">
    <img src="Envelope.png" alt="Envelope">
    <div class="lacre" onclick="abrirConvite()"></div>
  </div>

  <!-- CONVITE -->
  <div id="convite" class="tela">
    <img src="Convite.png" alt="Convite">

    <div class="botao localizacao"
      onclick="abrirLink('https://maps.app.goo.gl/HbZhvGYtLUhTJ5sFA')"></div>

    <div class="botao presente"
      onclick="abrirLink('https://drive.google.com/file/d/1ffSAqs13aapm8B6C-TKGGKoJl52UiiZz/view?usp=sharing')"></div>

    <div class="botao rsvp"
      onclick="abrirLink('https://wa.me/+5562992041324')"></div>
  </div>

</div>

<audio id="musica" src="Musica.mp4"></audio>

<script>
function abrirConvite() {
  document.getElementById('envelope').style.display = 'none';
  document.getElementById('convite').style.display = 'block';

  const musica = document.getElementById('musica');
  musica.play().catch(() => {});
}

function abrirLink(url) {
  window.open(url, '_blank');
}
</script>

</body>
</html>
